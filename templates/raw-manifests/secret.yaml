{{- if not .Values.db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "urls.fullname" . }}-secret
  labels:
    {{- include "urls.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ required "set db.password, or point db.existingSecret at a Secret with DB_PASSWORD" .Values.db.password | quote }}
{{- end }}
