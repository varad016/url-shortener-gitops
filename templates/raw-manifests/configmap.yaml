apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "urls.fullname" . }}-config
  labels:
    {{- include "urls.labels" . | nindent 4 }}
data:
  DB_HOST: {{ include "urls.dbHost" . | quote }}
  DB_PORT: {{ .Values.db.port | quote }}
  DB_NAME: {{ .Values.db.name | quote }}
  DB_USER: {{ .Values.db.user | quote }}
  DB_SSLMODE: {{ .Values.db.sslmode | quote }}
  BASE_URL: {{ .Values.app.baseUrl | quote }}
  CODE_LENGTH: {{ .Values.app.codeLength | quote }}
